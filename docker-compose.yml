version: "3.9"

name: professore-sql

volumes:
  db_data:

networks:
  professore-sql-net:
    driver: bridge

  traefik_proxy:
    external: true

services:
  # 1) WebApp
  web:
    working_dir: /app
    container_name: professore-sql-web

    build:
      context: .
      dockerfile: DockerFile

    environment:
      - FLASK_ENV=${FLASK_ENV}
      - QUERY_DB_HOST=db
      - QUERY_DB_PORT=3306
      - HISTORY_DB_HOST=db
      - HISTORY_DB_PORT=3306
      - QUERY_DB_USER=${QUERY_DB_USER}
      - QUERY_DB_PASSWORD=${QUERY_DB_PASSWORD}
      - QUERY_DB_NAMES=${QUERY_DB_NAMES} # Lista dei database per la lettura
      - HISTORY_DB_USER=${HISTORY_DB_USER}
      - HISTORY_DB_PASSWORD=${HISTORY_DB_PASSWORD}
      - HISTORY_DB_NAME=${HISTORY_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    # ports:
    #   - "${APP_PORT}:5000"
    depends_on:
      - db
    networks:
      - professore-sql-net
      - traefik_proxy

  # 2) Rende gli script .tpl in veri .sql con le variabili del .env
  initdb-renderer:
    image: bash:5
    container_name: professore-sql-renderer
    command: >
      bash -lc '
        set -e;
        mkdir -p /init;
        for f in /templates/*.tpl; do
          out="/init/$(basename "${f%.tpl}")";
          echo "[render] $f -> $out";
          envsubst < "$f" > "$out";
        done;
        ls -l /init;
      '
    environment:
      - HISTORY_DB_NAME=${HISTORY_DB_NAME}
      - DB1_NAME=${DB1_NAME}
      - DB2_NAME=${DB2_NAME}
      - DB3_NAME=${DB3_NAME}
      - DB4_NAME=${DB4_NAME}
      - HISTORY_DB_USER=${HISTORY_DB_USER}
      - HISTORY_DB_PASSWORD=${HISTORY_DB_PASSWORD}
      - QUERY_DB_USER=${QUERY_DB_USER}
      - QUERY_DB_PASSWORD=${QUERY_DB_PASSWORD}
    volumes:
      - ./initdb/merged:/init
      - ./initdb/templates:/templates:ro
    networks:
      - professore-sql-net
    restart: "no"

  # 2) Unico MySQL 8.x
  db:
    image: mysql:8.3
    container_name: professore-sql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Facoltativi: se lasci così, il DB non crea un "primo utente" extra
      # usiamo i nostri script per creare utenti e permessi.
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb/merged:/docker-entrypoint-initdb.d:ro
    depends_on:
      - initdb-renderer
    networks:
      - professore-sql-net
    restart: unless-stopped

  # 3) Unico phpMyAdmin puntato al servizio "db"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: professore-sql-pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # per login come root da pma:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # ports:
    #   - "${PMA_PORT:-8080}:80"
    depends_on:
      - db
    networks:
      - professore-sql-net
      - traefik_proxy
    restart: unless-stopped
